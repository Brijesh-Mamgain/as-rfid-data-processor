name: Build and Deploy RFID Processor

on:
  push:
    branches:
      - develop

env:
  ACR_NAME: rfidacr
  ACR_LOGIN_SERVER: rfidacr.azurecr.io
  IMAGE_NAME: rfid-processor
  #RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  RESOURCE_GROUP: rg-rfid-processor
  WEBAPP_NAME: rfid-processor-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name $ACR_NAME

    - name: Build Docker Image
      run: |
        docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} .
        docker tag $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

    - name: Push Image
      run: |
        docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
        docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

    - name: Update App Service Configuration
      run: |
        if [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$IMAGE_NAME" ] || [ -z "$RESOURCE_GROUP" ] || [ -z "$WEBAPP_NAME" ]; then
          echo "Error: Required variables are missing"
          exit 1
        fi

        LINUX_FX_VERSION="DOCKER|${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
        echo "Setting LinuxFxVersion to: $LINUX_FX_VERSION"

        az webapp config set \
          --resource-group $RESOURCE_GROUP \
          --name $WEBAPP_NAME \
          --linux-fx-version "$LINUX_FX_VERSION"

    - name: Configure ACR credentials on App Service
      run: |
        ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query username -o tsv)
        ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)

        az webapp config container set \
          --resource-group $RESOURCE_GROUP \
          --name $WEBAPP_NAME \
          --container-registry-url https://$ACR_LOGIN_SERVER \
          --container-registry-user $ACR_USERNAME \
          --container-registry-password $ACR_PASSWORD \
          --container-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

    - name: Set App Service application settings
      run: |
        az webapp config appsettings set \
          --resource-group $RESOURCE_GROUP \
          --name $WEBAPP_NAME \
          --settings \
            APP_ENV='prod' \
            APP_DEBUG='false' \
            AZURE_BLOB_CONNECTION_STRING='${{ secrets.AZURE_BLOB_CONNECTION_STRING }}' \
            AZURE_BLOB_ACCOUNT_URL='${{ secrets.AZURE_BLOB_ACCOUNT_URL }}' \
            AZURE_BLOB_CONTAINER_NAME='${{ secrets.AZURE_BLOB_CONTAINER_NAME }}' \
            AZURE_SQL_CONNECTION_STRING='${{ secrets.AZURE_SQL_CONNECTION_STRING }}' \
            WEBSITES_PORT='8000' \
            WEBSITES_CONTAINER_START_TIME_LIMIT='600' \
            MAX_UPLOAD_SIZE_BYTES='5242880' \
            MAX_LINE_LENGTH='256'

    - name: Deploy to App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest